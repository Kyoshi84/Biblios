{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Biblios{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Uwaga: stary main.html ładował nieistniejący od Django 3.1 tag
         "staticfiles" - poprawny tag do statyków to "static" (patrz load
         powyżej). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- htmx: pozwala na wyszukiwanie "na żywo" (bez przeładowania strony)
         bez pisania własnego JS/fetch - patrz directory/forms.py (hx-*) i
         list.html (#results). -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'directory:home' %}">Biblios</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'directory:index' %}">Katalog bibliotek</a>
        </div>
    </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
